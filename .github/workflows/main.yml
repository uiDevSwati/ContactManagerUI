name: CI

on:
  push:
    branches: [master]  # or [main] - match your default branch
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'  # or your target Node version
        cache: 'npm'  # or 'yarn' if you use yarn
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint  # if you have linting configured
    
    - name: Build
      run: npm run build
    
    - name: Test
      run: npm run test -- --watch=false  # for Angular projects
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      if: always()  # optional: for code coverage reporting
